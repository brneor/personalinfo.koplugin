name: Release KOReader plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Package personalinfo.koplugin
        run: |
          zip -r "personalinfo.koplugin-${GITHUB_REF_NAME}.zip" personalinfo.koplugin

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "personalinfo.koplugin-${GITHUB_REF_NAME}.zip" --generate-notes
